# Type-checks the interface, runs the storage tests on Windows and the
# interface tests in Chromium, on every pull request and every push.
name: Check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Type-check the interface
        run: npm run check

      # The storage tests build the app, which embeds the built interface.
      - name: Build the interface
        run: npm run build

      - name: Storage tests
        run: cargo test
        working-directory: src-tauri

  # Drives the interface in Chromium against the fake backend (tests/e2e).
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - run: npm ci

      # The live-session relay the two-person tests write through, and its own tests.
      - run: npm ci
        working-directory: server

      - name: Relay tests
        run: npm test
        working-directory: server

      - name: Get Chromium
        run: npx playwright install --with-deps chromium

      - name: Interface tests
        run: npm run e2e

      # What failed, with a trace of every step: download it from the run's
      # summary and open it with `npx playwright show-report`.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: interface-test-report
          path: playwright-report
          retention-days: 14
