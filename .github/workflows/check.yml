# Type-checks the interface, runs the storage tests on Windows and the
# interface tests in Chromium, on every pull request and every push.
name: Check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Type-check the interface
        run: npm run check

      # The storage tests build the app, which embeds the built interface.
      - name: Build the interface
        run: npm run build

      - name: Storage tests
        run: cargo test
        working-directory: src-tauri

  # Drives the interface in Chromium against the fake backend (tests/e2e).
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Get Chromium
        run: npx playwright install --with-deps chromium

      - name: Interface tests
        run: npm run e2e

      # What failed, with a trace of every step: download it from the run's
      # summary and open it with `npx playwright show-report`.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: interface-test-report
          path: playwright-report
          retention-days: 14
